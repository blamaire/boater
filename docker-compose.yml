# Lokale dev-stack. Alle secrets in `.env.local` (naast dit compose-bestand
# op de host). Laravel in de container ziet die als `.env` via bind-mount.
# Voor `${VAR}`-substitutie in dit bestand start je met
#   `docker compose --env-file .env.local up`
# — of je gebruikt `scripts/dev.sh` dat 'm voor je meegeeft.
#
# Snelheid op Windows: de Windows C-schijf is via Docker Desktop's bind-mount
# op /mnt/c ver-uit-de-hand traag voor mappen met heel veel files. Vandaar dat
# `vendor/`, `node_modules/`, `bootstrap/cache/` en `storage/framework/` in
# named volumes zitten in plaats van in de bind-mount van de repo. Die mappen
# leven daarmee binnen het docker-volume-filesystem en zijn ~10× sneller om
# te lezen. Consequentie: `composer install` en `npm install` moet je in de
# container draaien; op de host zijn deze mappen leeg.
#
# Parallelle feature-stacks: er staan bewust geen vaste `container_name`s in
# en de host-poorten zijn instelbaar (RZVG_WEB_PORT, RZVG_VITE_PORT,
# RZVG_DB_PORT, RZVG_MAIL_PORT; standaard 8000/5173/3307/8025). Zo kan
# `scripts/feature-stack.ps1` naast deze standaardstack extra stacks starten
# voor een git-worktree, elk met een eigen projectnaam, poorten, volumes en
# database. Zie de sectie "Parallelle features" in CLAUDE.md.

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env.local
    volumes:
      - .:/var/www/html
      - ./.env.local:/var/www/html/.env:ro
      - app_vendor:/var/www/html/vendor
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - app_storage_framework:/var/www/html/storage/framework
    depends_on:
      - db

  web:
    image: nginx:1.27-alpine
    ports:
      - "${RZVG_WEB_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db-data:/var/lib/mysql
    ports: ["${RZVG_DB_PORT:-3307}:3306"]

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - app_node_modules:/var/www/html/node_modules
    # Vite luistert in de container op dezelfde poort als op de host, zodat
    # de URL's in public/hot en de HMR-verbinding kloppen (zie vite.config.js).
    environment:
      RZVG_WEB_PORT: ${RZVG_WEB_PORT:-8000}
      RZVG_VITE_PORT: ${RZVG_VITE_PORT:-5173}
    ports:
      - "${RZVG_VITE_PORT:-5173}:${RZVG_VITE_PORT:-5173}"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  selenium:
    image: selenium/standalone-chromium:latest
    shm_size: 2gb
    profiles: ["dusk"]

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${RZVG_MAIL_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env.local
    volumes:
      - .:/var/www/html
      - ./.env.local:/var/www/html/.env:ro
      - app_vendor:/var/www/html/vendor
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - app_storage_framework:/var/www/html/storage/framework
    command: php artisan queue:work database --tries=3 --sleep=3
    # Herstart vanzelf als de worker valt (bv. tijdens `composer db-reset`, of
    # in een nieuwe feature-stack zolang `composer install` nog loopt).
    restart: unless-stopped
    depends_on:
      - db

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env.local
    volumes:
      - .:/var/www/html
      - ./.env.local:/var/www/html/.env:ro
      - app_vendor:/var/www/html/vendor
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
      - app_storage_framework:/var/www/html/storage/framework
    command: php artisan schedule:work
    restart: unless-stopped
    depends_on:
      - db

volumes:
  db-data:
  app_vendor:
  app_node_modules:
  app_bootstrap_cache:
  app_storage_framework:
